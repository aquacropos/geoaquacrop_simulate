[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoaquacrop_simulate"
version = "0.1.0b1"              # beta; pip needs --pre to install it
description = "Gridded AquaCrop-OSPy simulation runner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }       # replace with your chosen licence
authors = [{ name = "Chris Bowden" }]

# ----------------------------------------------------------------------------
# ANTI-PUBLICATION GUARD (remove this entire `classifiers` block to go live).
# PyPI rejects any upload whose metadata contains "Private :: Do Not Upload",
# so an accidental `twine upload` or publish workflow will fail with a 400.
# ----------------------------------------------------------------------------
classifiers = [
    "Private :: Do Not Upload",
]

dependencies = [
    "numpy",
    "pandas",
    "xarray>=2025.1",
    "netcdf4",
    "tqdm",
    "aquacrop",                  
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
correction = ["geopandas", "matplotlib"]   # yield correction + comparison figures
docs = ["sphinx>=7", "furo"]

[project.scripts]
geoaquacrop_simulate = "geoaquacrop_simulate.run_aquacrop:main"

[tool.setuptools.packages.find]
where = ["src"]
