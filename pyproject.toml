[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoaquacrop_simulate"
version = "0.1.0b1"              # beta; pip needs --pre to install it
description = "Gridded AquaCrop-OSPy simulation runner"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]     
authors = [
    { name = "Chris Bowden" },
    { name = "Tim Foster" },
    ]

maintainers = [
    { name = "Chris Bowden", email = "christopher.bowden@manchester.ac.uk" },
]

dependencies = [
    "numpy",
    "pandas",
    "xarray>=2025.1",
    "netcdf4",
    "tqdm",
    "aquacrop",                  
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
correction = ["geopandas", "matplotlib"]   # yield correction + comparison figures
docs = ["sphinx>=7", "furo"]

[project.scripts]
geoaquacrop_simulate = "geoaquacrop_simulate.run_aquacrop:main"

[tool.setuptools.packages.find]
where = ["src"]
