[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquacropgrid-run"
version = "0.1.0.dev0"            # dev marker; bump to 0.1.0 for the first real release
description = "Gridded AquaCrop-OSPy simulation runner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }       # replace with your chosen licence
authors = [{ name = "Chris Bowden" }]

# ----------------------------------------------------------------------------
# ANTI-PUBLICATION GUARD (remove this entire `classifiers` block to go live).
# PyPI rejects any upload whose metadata contains "Private :: Do Not Upload",
# so an accidental `twine upload` or publish workflow will fail with a 400.
# ----------------------------------------------------------------------------
classifiers = [
    "Private :: Do Not Upload",
]

dependencies = [
    "numpy",
    "pandas",
    "xarray>=2025.1",
    "netcdf4",
    "tqdm",
    "aquacrop",                  
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
plots = ["plotly", "dash"]       # only needed for plots.py / the dashboard

[project.scripts]
aquacropgrid-run = "aquacropgrid_run.run_aquacrop:main"

[tool.setuptools.packages.find]
where = ["src"]
